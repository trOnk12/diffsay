name: release
on:
  push:
    tags: ["v*.*.*"]   # not the moving v0 Action tag
  workflow_dispatch:   # manual run publishes to TestPyPI
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches __version__
        if: github.event_name == 'push'
        run: python scripts/check_tag_version.py "$GITHUB_REF_NAME"
      - name: Tests must pass before anything is published
        run: pip install . pyyaml && python -m unittest discover -s tests -v
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing: no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
